[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctx-explorer"
version = "0.1.0"
description = "Drag-to-select similarity search over Mars CTX / Murray Lab mosaic imagery with DINOv3 embeddings and FAISS"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "BSD-3-Clause"}
authors = [{name = "David Ackerman", email = "ackermand@hhmi.org"}]
keywords = ["mars", "ctx", "murray-lab", "image-retrieval", "dinov3", "faiss", "similarity-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.26.0,<2.4",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "hdbscan>=0.8.33",
    "umap-learn>=0.5.5",
    "numba>=0.59.0",
    "pyarrow>=14.0.0",
    "faiss-cpu>=1.7.4",
    "termcolor>=2.0.0",       # required by DINOv3 torch.hub code
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "streamlit>=1.40.0",
    "streamlit-cropper>=0.3.1,<0.4",
]

[project.urls]
Repository = "https://github.com/davidackerman/mars_ctx_explorer"
Issues = "https://github.com/davidackerman/mars_ctx_explorer/issues"

[tool.pixi.workspace]
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

[tool.pixi.feature.dev.pypi-dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=4.1.0"
black = ">=24.0.0"
ruff = ">=0.2.0"
mypy = ">=1.8.0"
pre-commit = ">=3.6.0"

[tool.pixi.environments]
default = {features = ["dev"], solve-group = "default"}
prod = {solve-group = "default"}

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = "\\.pyi?$"

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "N", "W", "B"]
lint.ignore = ["E203", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pixi.dependencies]
python = "3.12.*"
pytorch = {version = ">=2.0.0", channel = "pytorch", build = "*cuda*"}
torchvision = {version = ">=0.15.0", channel = "pytorch"}
numpy = ">=1.26.0,<2.4"
gdal = ">=3.8.0"
opencv = ">=4.12.0,<5"
transformers = ">=4.56.0,<5.0"
huggingface_hub = ">=0.34.0,<1.0"
pyarrow = ">=22.0.0,<23"
# ISIS3 conflicts with Python 3.12 — install it in a separate conda env (see docs/ISIS3_SETUP.md)

[tool.pixi.pypi-dependencies]
ctx-explorer = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest tests/ -v"
lint = "ruff check src/ scripts/ tests/"
format = "black src/ scripts/ tests/"
typecheck = "mypy src/"
ctx-download = "python scripts/download_ctx_images.py --output-dir data/raw/ctx --limit 100"
ctx-pipeline = "python scripts/run_ctx_pipeline.py"
ctx-build-sim-index = "python scripts/build_ctx_retrieval_index.py --image-dir data/raw/ctx --index-dir outputs/ctx_similarity"
ctx-build-patch-index = "python scripts/build_ctx_patch_index.py"
ctx-similarity-app = "streamlit run scripts/ctx_similarity_app.py -- --index-dir outputs/ctx_similarity"
ctx-viewer = "python scripts/ctx_viewer_server.py"
murray-index = "python scripts/stream_murray_index.py"
murray-patch-index = "python scripts/stream_murray_patch_index.py"
murray-viewer = "python scripts/murray_viewer.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ctx_explorer"]
